
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Seller Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5fa;color:#202b40}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:7px;padding:11px 15px;background:#5267ed;color:white}
button:hover{opacity:.9}
input,select,textarea{width:100%;padding:11px;border:1px solid #d8deea;border-radius:7px;margin:6px 0 13px;background:white}
label{font-size:13px;font-weight:bold}
.hidden{display:none!important}
#loginPage{max-width:400px;margin:70px auto;background:white;padding:25px;border-radius:13px;box-shadow:0 5px 25px #0001}
#loginPage h2{color:#5267ed}
.layout{display:flex;min-height:100vh}
.sidebar{width:235px;background:#18243b;color:white;padding:22px 15px;flex-shrink:0}
.brand{font-size:23px;font-weight:bold;margin:5px 10px 30px}
.brand span{color:#7e96ff}
.nav button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;color:#dbe3f7}
.nav button.active,.nav button:hover{background:#34466b;color:white}
.main{flex:1;min-width:0}
.topbar{background:white;padding:18px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e9f1}
.content{padding:25px;max-width:1300px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}
.card,.panel{background:white;border-radius:11px;padding:19px;box-shadow:0 2px 10px #00000008}
.card small{color:#7c8799}
.card h2{margin:10px 0 0;font-size:27px}
.panel{margin-bottom:20px;overflow-x:auto}
.panel h3{margin-top:0}
table{width:100%;border-collapse:collapse;min-width:550px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f5;font-size:14px}
th{color:#6c7789;background:#f8f9fc}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{padding:7px 10px;font-size:12px}
.danger{background:#e34d59}
.secondary{background:#77849a}
.green{background:#159c70}
.badge{padding:5px 9px;border-radius:20px;background:#edf0ff;color:#4058d8;font-size:12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:5}
.modalbox{background:white;border-radius:12px;padding:22px;width:100%;max-width:500px;max-height:90vh;overflow:auto}
.modalhead{display:flex;justify-content:space-between;align-items:center}
.modalhead button{background:#e9edf5;color:#333}
.empty{text-align:center;padding:30px;color:#7b8798}
.notice{padding:12px;border-radius:7px;background:#eef2ff;color:#344a9b;margin:10px 0}
@media(max-width:750px){
 .layout{display:block}
 .sidebar{width:100%;padding:12px}
 .brand{margin:5px 8px 12px}
 .nav{display:flex;overflow-x:auto;gap:5px}
 .nav button{white-space:nowrap;width:auto;margin:0;padding:10px}
 .cards{grid-template-columns:1fr 1fr}
 .content{padding:14px}
 .topbar{padding:14px}
 .formgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="loginPage">
<h2>Smart Seller</h2>
<h3>Admin Login</h3>
<form id="loginForm">
<label>Admin Email</label>
<input id="loginEmail" type="email" required placeholder="Admin email">
<label>Password</label>
<input id="loginPassword" type="password" required placeholder="Password">
<button style="width:100%">Login</button>
</form>
<p id="loginError" style="color:#d33"></p>
<small>Default demo login: admin@smartseller.com</small>
</div>

<div id="adminApp" class="layout hidden">
<aside class="sidebar">
<div class="brand">Smart <span>Seller.</span></div>
<div class="nav">
<button class="active" data-page="dashboard">▦ Dashboard</button>
<button data-page="products">▣ Products</button>
<button data-page="orders">▤ Orders</button>
<button data-page="customers">♙ Customers</button>
<button data-page="categories">▧ Categories</button>
<button data-page="settings">⚙ Settings</button>
<button id="logoutBtn">↪ Logout</button>
</div>
</aside>

<main class="main">
<div class="topbar">
<strong id="pageTitle">Dashboard</strong>
<span id="adminLabel">Admin</span>
</div>
<div class="content" id="pageContent"></div>
</main>
</div>

<div id="modal" class="modal hidden">
<div class="modalbox">
<div class="modalhead">
<h3 id="modalTitle">Form</h3>
<button onclick="closeModal()">✕</button>
</div>
<div id="modalBody"></div>
</div>
</div>

<script>
const KEY="smartSellerAdminDataV2";
const AUTH="smartSellerAdminLoggedIn";
const DEFAULT_EMAIL="admin@smartseller.com";
const DEFAULT_PASSWORD="Admin123!";

let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
 products:[],orders:[],customers:[],
 categories:["General","Electronics","Clothing","Food"],
 email:DEFAULT_EMAIL,password:DEFAULT_PASSWORD
};

function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
}
function money(n){
 return "$"+Number(n||0).toFixed(2);
}
function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function id(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
function showApp(){
 document.getElementById("loginPage").classList.add("hidden");
 document.getElementById("adminApp").classList.remove("hidden");
 document.getElementById("adminLabel").textContent=data.email;
 render("dashboard");
}
document.getElementById("loginForm").addEventListener("submit",e=>{
 e.preventDefault();
 const email=document.getElementById("loginEmail").value.trim();
 const pass=document.getElementById("loginPassword").value;
 if(email===data.email && pass===data.password){
  sessionStorage.setItem(AUTH,"yes");
  document.getElementById("loginError").textContent="";
  showApp();
 }else{
  document.getElementById("loginError").textContent="Wrong email or password.";
 }
});
document.getElementById("logoutBtn").onclick=()=>{
 sessionStorage.removeItem(AUTH);
 location.reload();
};
document.querySelectorAll(".nav button[data-page]").forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  render(b.dataset.page);
 };
});
function render(page){
 const titles={
 dashboard:"Dashboard",products:"Products",orders:"Orders",
 customers:"Customers",categories:"Categories",settings:"Settings"
 };
 document.getElementById("pageTitle").textContent=titles[page]||"Dashboard";
 const root=document.getElementById("pageContent");
 if(page==="dashboard")root.innerHTML=dashboardHTML();
 if(page==="products")root.innerHTML=productsHTML();
 if(page==="orders")root.innerHTML=ordersHTML();
 if(page==="customers")root.innerHTML=customersHTML();
 if(page==="categories")root.innerHTML=categoriesHTML();
 if(page==="settings")root.innerHTML=settingsHTML();
}
function dashboardHTML(){
 const sales=data.orders.filter(o=>o.status==="Completed")
 .reduce((s,o)=>s+Number(o.total),0);
 return `
 <div class="cards">
 <div class="card"><small>Total Products</small><h2>${data.products.length}</h2></div>
 <div class="card"><small>Total Orders</small><h2>${data.orders.length}</h2></div>
 <div class="card"><small>Total Customers</small><h2>${data.customers.length}</h2></div>
 <div class="card"><small>Completed Sales</small><h2>${money(sales)}</h2></div>
 </div>
 <div class="panel">
 <h3>Recent Orders</h3>
 ${data.orders.length?ordersTable(data.orders.slice(-5).reverse()):
 '<div class="empty">No orders yet.</div>'}
 </div>
 <div class="panel">
 <h3>Quick Actions</h3>
 <button onclick="render('products');setActive('products')">+ Add Product</button>
 <button class="secondary" onclick="render('orders');setActive('orders')">View Orders</button>
 </div>`;
}
function setActive(page){
 document.querySelectorAll(".nav button").forEach(b=>{
 b.classList.toggle("active",b.dataset.page===page);
 });
 document.getElementById("pageTitle").textContent=
 page.charAt(0).toUpperCase()+page.slice(1);
}
function productsHTML(){
 return `<div class="panel">
 <button onclick="productForm()">+ Add New Product</button>
 <h3>All Products (${data.products.length})</h3>
 ${data.products.length?`
 <table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
 <tbody>${data.products.map(p=>`
 <tr><td>${safe(p.name)}</td><td>${safe(p.category)}</td>
 <td>${money(p.price)}</td><td>${p.stock}</td>
 <td class="actions">
 <button onclick="productForm('${p.id}')">Edit</button>
 <button class="danger" onclick="deleteProduct('${p.id}')">Delete</button>
 </td></tr>`).join("")}</tbody></table>`
 :'<div class="empty">No products. Click Add New Product.</div>'}
 </div>`;
}
function productForm(productId){
 const p=data.products.find(x=>x.id===productId)||{};
 openModal(productId?"Edit Product":"Add Product",`
 <form id="productForm">
 <label>Product Name</label><input name="name" required value="${safe(p.name||"")}">
 <div class="formgrid">
 <div><label>Price ($)</label><input name="price" type="number" min="0" step=".01" required value="${p.price??""}"></div>
 <div><label>Stock Quantity</label><input name="stock" type="number" min="0" required value="${p.stock??0}"></div>
 </div>
 <label>Category</label><select name="category">
 ${data.categories.map(c=>`<option ${p.category===c?"selected":""}>${safe(c)}</option>`).join("")}
 </select>
 <label>Description</label><textarea name="description">${safe(p.description||"")}</textarea>
 <button style="width:100%">Save Product</button>
 </form>`);
 document.getElementById("productForm").onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  const item={
   id:productId||id(),name:f.get("name").trim(),
   price:Number(f.get("price")),stock:Number(f.get("stock")),
   category:f.get("category"),description:f.get("description")
  };
  if(productId)data.products=data.products.map(x=>x.id===productId?item:x);
  else data.products.push(item);
  save();closeModal();render("products");
 };
}
function deleteProduct(productId){
 if(!confirm("Delete this product?"))return;
 data.products=data.products.filter(p=>p.id!==productId);
 save();render("products");
}
function ordersHTML(){
 return `<div class="panel"><h3>All Orders (${data.orders.length})</h3>
 ${data.orders.length?ordersTable([...data.orders].reverse()):
 '<div class="empty">No orders yet.</div>'}</div>`;
}
function ordersTable(orders){
 return `<table><thead><tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Update</th></tr></thead><tbody>
 ${orders.map(o=>`<tr>
 <td>${safe(o.id)}</td><td>${safe(o.customer)}</td><td>${money(o.total)}</td>
 <td><span class="badge">${safe(o.status)}</span></td>
 <td><select onchange="changeOrderStatus('${o.id}',this.value)">
 ${["Pending","Processing","Completed","Cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}
 </select></td>
 </tr>`).join("")}</tbody></table>`;
}
function changeOrderStatus(orderId,status){
 const o=data.orders.find(x=>x.id===orderId);
 if(o){o.status=status;save();render("orders");}
}
function customersHTML(){
 return `<div class="panel"><h3>Customers (${data.customers.length})</h3>
 ${data.customers.length?`
 <table><thead><tr><th>Name</th><th>Email</th><th>Phone</th></tr></thead>
 <tbody>${data.customers.map(c=>`<tr><td>${safe(c.name)}</td><td>${safe(c.email)}</td><td>${safe(c.phone||"")}</td></tr>`).join("")}</tbody></table>`
 :'<div class="empty">No customer records yet. Customers can be added here manually.</div>'}
 <button onclick="customerForm()">+ Add Customer</button></div>`;
}
function customerForm(){
 openModal("Add Customer",`
 <form id="customerForm">
 <label>Name</label><input name="name" required>
 <label>Email</label><input name="email" type="email" required>
 <label>Phone</label><input name="phone">
 <button style="width:100%">Save Customer</button>
 </form>`);
 document.getElementById("customerForm").onsubmit=e=>{
  e.preventDefault();const f=new FormData(e.target);
  data.customers.push({name:f.get("name"),email:f.get("email"),phone:f.get("phone")});
  save();closeModal();render("customers");
 };
}
function categoriesHTML(){
 return `<div class="panel"><h3>Product Categories</h3>
 <form id="categoryForm">
 <label>New Category</label><input name="category" required placeholder="Category name">
 <button>Add Category</button></form>
 <table><thead><tr><th>Category</th><th>Action</th></tr></thead><tbody>
 ${data.categories.map(c=>`<tr><td>${safe(c)}</td><td><button class="danger" onclick="deleteCategory('${safe(c)}')">Delete</button></td></tr>`).join("")}
 </tbody></table></div>`;
}
function deleteCategory(c){
 if(data.products.some(p=>p.category===c)){
  alert("This category is used by a product. Change the product category first.");return;
 }
 data.categories=data.categories.filter(x=>x!==c);
 save();render("categories");
}
function settingsHTML(){
 return `<div class="panel">
 <h3>Admin Account</h3>
 <form id="settingsForm">
 <label>Admin Email</label><input name="email" type="email" required value="${safe(data.email)}">
 <label>New Password</label><input name="password" type="password" minlength="6" placeholder="Enter new password">
 <button>Save Account Settings</button>
 </form></div>
 <div class="panel"><h3>Data Backup</h3>
 <p>Download a copy of your products, orders, customers and categories.</p>
 <button onclick="downloadBackup()">Download Backup</button>
 <p style="margin-top:20px">Restore a previous backup:</p>
 <input id="backupFile" type="file" accept=".json">
 <button class="secondary" onclick="restoreBackup()">Restore Backup</button>
 </div>
 <div class="panel"><h3>Important</h3>
 <div class="notice">This version saves data in this browser only. It does not securely store shared data online. For a real multi-device store, a secure database and server login are required.</div>
 </div>`;
}
function downloadBackup(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download="smart-seller-backup.json";a.click();
 URL.revokeObjectURL(url);
}
function restoreBackup(){
 const file=document.getElementById("backupFile").files[0];
 if(!file){alert("Choose a backup file first.");return;}
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const restored=JSON.parse(reader.result);
   if(!Array.isArray(restored.products)||!Array.isArray(restored.orders)||
      !Array.isArray(restored.customers)||!Array.isArray(restored.categories)){
    throw new Error("Invalid backup");
   }
   if(!confirm("Replace current data with this backup?"))return;
   data=restored;save();alert("Backup restored.");render("dashboard");
  }catch(e){alert("This backup file is not valid.");}
 };
 reader.readAsText(file);
}
document.getElementById("settingsForm")?.addEventListener("submit",e=>{
 e.preventDefault();
 const f=new FormData(e.target);
 data.email=f.get("email").trim();
 if(f.get("password"))data.password=f.get("password");
 save();
 document.getElementById("adminLabel").textContent=data.email;
 alert("Settings saved.");
 render("settings");
});
function openModal(title,html){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalBody").innerHTML=html;
 document.getElementById("modal").classList.remove("hidden");
}
function closeModal(){
 document.getElementById("modal").classList.add("hidden");
}
document.getElementById("modal").addEventListener("click",e=>{
 if(e.target.id==="modal")closeModal();
});
document.getElementById("categoryForm")?.addEventListener("submit",e=>{
 e.preventDefault();
 const name=new FormData(e.target).get("category").trim();
 if(data.categories.some(c=>c.toLowerCase()===name.toLowerCase())){
  alert("Category already exists.");return;
 }
 data.categories.push(name);save();render("categories");
});
if(sessionStorage.getItem(AUTH)==="yes")showApp();
</script>
</body>
</html>
