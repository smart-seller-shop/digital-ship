
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Seller Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5fa;color:#202b40;font-family:Arial}
button,input,select,textarea{font:inherit}
button{background:#5267ed;color:white;border:0;border-radius:7px;padding:11px;cursor:pointer}
input,select,textarea{width:100%;padding:11px;margin:7px 0 14px;border:1px solid #d8deea;border-radius:7px}
label{font-size:13px;font-weight:bold}
.hidden{display:none!important}
#login{max-width:390px;margin:65px auto;background:white;padding:25px;border-radius:13px;box-shadow:0 4px 20px #0001}
#login h2{color:#5267ed}
.layout{display:flex;min-height:100vh}
aside{width:230px;background:#18243b;color:white;padding:18px;flex-shrink:0}
.brand{font-size:23px;font-weight:bold;margin:10px 5px 25px}
.brand span{color:#8ca2ff}
nav button{width:100%;display:block;text-align:left;background:transparent;color:#e0e6f4;margin:4px 0}
nav button.active,nav button:hover{background:#35496e}
main{flex:1;min-width:0}
header{padding:18px 24px;background:white;display:flex;justify-content:space-between}
.content{padding:22px;max-width:1300px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}
.card,.panel{background:white;border-radius:10px;padding:18px;margin-bottom:17px;box-shadow:0 2px 9px #00000008}
.card small{color:#778398}.card h2{margin-bottom:0}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:11px;border-bottom:1px solid #eee;font-size:13px}
th{background:#f7f8fc}
.tablewrap{overflow-x:auto}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.actions button{padding:7px 9px;font-size:12px}
.red{background:#df4b58}.green{background:#159c70}.gray{background:#77849a}
.badge{background:#edf0ff;color:#4357c9;padding:5px 8px;border-radius:15px}
.notice{background:#fff5d9;color:#76591a;padding:12px;border-radius:7px;font-size:13px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px}
.modalbox{background:white;width:100%;max-width:480px;padding:22px;border-radius:12px;max-height:90vh;overflow:auto}
.modalbox h3{margin-top:0}
.row{display:flex;gap:10px}
.row>*{flex:1}
.empty{text-align:center;padding:25px;color:#8791a2}
@media(max-width:750px){
 .layout{display:block}aside{width:100%;padding:12px}
 .brand{margin:5px 8px 12px}
 nav{display:flex;overflow-x:auto;gap:4px}
 nav button{white-space:nowrap;width:auto}
 .cards{grid-template-columns:1fr 1fr}
 .content{padding:12px}header{padding:14px}
}
</style>
</head>
<body>

<div id="login">
<h2>Smart Seller.</h2>
<h3>Admin Login</h3>
<form id="loginForm">
<label>Email</label>
<input id="email" type="email" required placeholder="Admin email">
<label>Password</label>
<input id="password" type="password" required placeholder="Password">
<button style="width:100%">Login</button>
</form>
<p id="loginError" style="color:red"></p>
<small>Demo: admin@smartseller.com / Admin123!</small>
</div>

<div id="app" class="layout hidden">
<aside>
<div class="brand">Smart <span>Seller.</span></div>
<nav id="nav">
<button class="active" data-page="dashboard">Dashboard</button>
<button data-page="products">Products</button>
<button data-page="orders">Orders</button>
<button data-page="balance">Add Balance</button>
<button data-page="withdrawals">Withdrawals</button>
<button data-page="kyc">KYC Verification</button>
<button data-page="support">Customer Service</button>
<button data-page="customers">Customers</button>
<button data-page="settings">Settings</button>
<button id="logout">Logout</button>
</nav>
</aside>
<main>
<header><strong id="heading">Dashboard</strong><span>Admin Panel</span></header>
<div class="content" id="content"></div>
</main>
</div>

<div id="modal" class="modal hidden">
<div class="modalbox">
<div style="display:flex;justify-content:space-between">
<h3 id="modalTitle">Details</h3>
<button class="gray" onclick="closeModal()">X</button>
</div>
<div id="modalBody"></div>
</div>
</div>

<script>
const DB="smartSellerFullAdminV3";
const AUTH="smartSellerAdminAuth";
const initial={
 products:[],orders:[],customers:[],transactions:[],
 withdrawals:[],kyc:[],tickets:[],
 email:"admin@smartseller.com",password:"Admin123!"
};

let db=JSON.parse(localStorage.getItem(DB)||"null")||initial;
let page="dashboard";

function save(){localStorage.setItem(DB,JSON.stringify(db))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cash(n){return "$"+Number(n||0).toFixed(2)}

function openModal(title,html){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalBody").innerHTML=html;
 document.getElementById("modal").classList.remove("hidden");
}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};

document.getElementById("loginForm").onsubmit=e=>{
 e.preventDefault();
 if(email.value.trim()===db.email&&password.value===db.password){
  sessionStorage.setItem(AUTH,"yes");showApp();
 }else loginError.textContent="Incorrect email or password";
};

document.getElementById("logout").onclick=()=>{
 sessionStorage.removeItem(AUTH);location.reload();
};

function showApp(){
 login.classList.add("hidden");app.classList.remove("hidden");render("dashboard");
}

document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("[data-page]").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");render(b.dataset.page);
});

function render(p){
 page=p;heading.textContent=p[0].toUpperCase()+p.slice(1);
 let html="";
 if(p==="dashboard")html=dashboard();
 if(p==="products")html=products();
 if(p==="orders")html=orders();
 if(p==="balance")html=balance();
 if(p==="withdrawals")html=withdrawals();
 if(p==="kyc")html=kyc();
 if(p==="support")html=support();
 if(p==="customers")html=customers();
 if(p==="settings")html=settings();
 content.innerHTML=html;
}

function dashboard(){
 let completed=db.orders.filter(o=>o.status==="Sent").length;
 let total=db.transactions.filter(t=>t.type==="Credit").reduce((s,t)=>s+t.amount,0);
 return `<div class="cards">
 <div class="card"><small>Products</small><h2>${db.products.length}</h2></div>
 <div class="card"><small>Orders</small><h2>${db.orders.length}</h2></div>
 <div class="card"><small>Customers</small><h2>${db.customers.length}</h2></div>
 <div class="card"><small>Orders Sent</small><h2>${completed}</h2></div>
 </div>
 <div class="panel"><h3>Balance Credits Recorded</h3><h2>${cash(total)}</h2>
 <p class="notice">This is a demo record, not verified real money or a payment account.</p></div>
 <div class="panel"><h3>Quick Actions</h3>
 <button onclick="render('products')">Add Product</button>
 <button onclick="render('orders')">Manage Orders</button>
 <button onclick="render('withdrawals')">Withdrawals</button>
 </div>`;
}

/* PRODUCTS SECTION */
function products(){
 return `<div class="panel"><button onclick="productForm()">+ Add Product</button>
 <h3>Products</h3>
 ${db.products.length?table(["Image","Name","Price","Stock","Action"],db.products.map(p=>[
 p.image?`<img src="${esc(p.image)}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:6px" onerror="this.style.display='none'">`:"—",
 esc(p.name),cash(p.price),p.stock,
 `<div class="actions">
 <button onclick="productForm('${p.id}')">Edit</button>
 <button class="red" onclick="removeProduct('${p.id}')">Delete</button>
 </div>`
 ])):'<div class="empty">No products added. Click “+ Add Product” to add your first product.</div>'}
 </div>`;
}

function productForm(pid){
 let p=db.products.find(x=>x.id===pid)||{};

 openModal(pid?"Edit Product":"Add Product",`
 <form id="pf">
 <label>Product name</label>
 <input name="name" required maxlength="100" value="${esc(p.name)}" placeholder="Enter product name">

 <div class="row">
 <div>
 <label>Price ($)</label>
 <input name="price" type="number" min="0" step=".01" required value="${p.price??""}" placeholder="0.00">
 </div>
 <div>
 <label>Stock / Quantity</label>
 <input name="stock" type="number" min="0" step="1" required value="${p.stock??0}" placeholder="0">
 </div>
 </div>

 <label>Product image URL (optional)</label>
 <input name="image" type="url" value="${esc(p.image)}" placeholder="https://example.com/product.jpg">

 <label>Description</label>
 <textarea name="description" placeholder="Write product details">${esc(p.description)}</textarea>

 <button type="submit" style="width:100%">Save Product</button>
 </form>`);

 const form=document.getElementById("pf");

 form.onsubmit=e=>{
  e.preventDefault();

  const f=new FormData(form);
  const name=String(f.get("name")||"").trim();
  const price=Number(f.get("price"));
  const stock=Number(f.get("stock"));

  if(!name||!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0){
   alert("Please enter a product name, a valid price, and a whole-number stock quantity.");
   return;
  }

  const item={
   id:pid||id(),
   name:name,
   price:price,
   stock:stock,
   image:String(f.get("image")||"").trim(),
   description:String(f.get("description")||"").trim()
  };

  if(pid)db.products=db.products.map(x=>x.id===pid?item:x);
  else db.products.push(item);

  save();
  closeModal();
  render("products");
 };
}

function removeProduct(pid){
 if(confirm("Delete product?")){
  db.products=db.products.filter(p=>p.id!==pid);
  save();
  render("products");
 }
}

function orders(){
 return `<div class="panel"><button onclick="orderForm()">+ Create / Send Order</button><h3>Order Management</h3>
 ${db.orders.length?table(["Order","Customer","Product","Qty","Total","Status","Actions"],db.orders.map(o=>[
 esc(o.id),esc(o.customer),esc(o.product),o.qty,cash(o.total),
 `<span class="badge">${esc(o.status)}</span>`,
 `<div class="actions"><button class="green" onclick="orderStatus('${o.id}','Sent')">Send</button><button class="red" onclick="orderStatus('${o.id}','Rejected')">Reject</button><button class="gray" onclick="orderStatus('${o.id}','Processing')">Processing</button></div>`
 ])):'<div class="empty">No orders yet.</div>'}</div>`;
}

function orderForm(){
 openModal("Create Order",`<form id="of">
 <label>Customer name</label><input name="customer" required>
 <label>Product</label><select name="product" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} - ${cash(p.price)} (Stock ${p.stock})</option>`).join("")}</select>
 <label>Quantity</label><input name="qty" type="number" min="1" value="1" required>
 <button style="width:100%">Create Order</button></form>`);

 of.onsubmit=e=>{
  e.preventDefault();
  let f=new FormData(of),p=db.products.find(x=>x.id===f.get("product")),q=+f.get("qty");
  if(!p||q>p.stock){alert("Product unavailable or stock is insufficient.");return}
  p.stock-=q;
  db.orders.push({id:id(),customer:f.get("customer"),product:p.name,qty:q,total:p.price*q,status:"Pending"});
  save();closeModal();render("orders");
 };
}

function orderStatus(oid,status){
 let o=db.orders.find(x=>x.id===oid);if(!o)return;
 if(status==="Sent"&&!confirm("Confirm that this order has actually been dispatched?"))return;
 o.status=status;save();render("orders");
}

function balance(){
 return `<div class="panel"><h3>Add Balance Record</h3>
 <p class="notice">Only record a credit after independently verifying the payment. This demo does not transfer money.</p>
 <form id="bf"><label>Customer email or ID</label><input name="customer" required>
 <label>Amount</label><input name="amount" type="number" min=".01" step=".01" required>
 <label>Reference / Note</label><input name="note">
 <button>Add Balance Record</button></form></div>
 <div class="panel"><h3>Balance Records</h3>${transactionTable()}</div>`;
}

function transactionTable(){
 return db.transactions.length?table(["Customer","Amount","Type","Reference"],db.transactions.map(t=>[
 esc(t.customer),cash(t.amount),esc(t.type),esc(t.note)
 ])):'<div class="empty">No balance records.</div>';
}

function withdrawals(){
 return `<div class="panel"><h3>Withdrawal Requests</h3>
 <p class="notice">Approve only after checking identity, available funds and payment details. No real payout occurs here.</p>
 ${db.withdrawals.length?table(["Customer","Amount","Payout Details","Status","Action"],db.withdrawals.map(w=>[
 esc(w.customer),cash(w.amount),esc(w.details),esc(w.status),
 `<div class="actions"><button class="green" onclick="withdrawStatus('${w.id}','Approved')">Approve</button><button class="red" onclick="withdrawStatus('${w.id}','Rejected')">Reject</button></div>`
 ])):'<div class="empty">No withdrawal requests.</div>'}</div>
 <div class="panel"><h3>Add Demo Withdrawal Request</h3>
 <form id="wf"><label>Customer email or ID</label><input name="customer" required>
 <label>Amount</label><input name="amount" type="number" min=".01" step=".01" required>
 <label>Payout details (masked only)</label><input name="details" placeholder="e.g. ****1234" required>
 <button>Create Request</button></form></div>`;
}

function withdrawStatus(wid,status){
 let w=db.withdrawals.find(x=>x.id===wid);if(!w)return;
 if(!confirm("Change request status to "+status+"?"))return;
 w.status=status;save();render("withdrawals");
}

function kyc(){
 return `<div class="panel"><h3>KYC Review</h3>
 <p class="notice">Demo status tracker only. Do not upload or store passports, ID photos, or sensitive identity documents in this browser-only demo.</p>
 ${db.kyc.length?table(["Customer","Reference","Status","Action"],db.kyc.map(k=>[
 esc(k.customer),esc(k.reference),esc(k.status),
 `<div class="actions"><button class="green" onclick="kycStatus('${k.id}','Verified')">Verify</button><button class="red" onclick="kycStatus('${k.id}','Rejected')">Reject</button></div>`
 ])):'<div class="empty">No KYC records.</div>'}</div>
 <div class="panel"><h3>Add KYC Review Record</h3>
 <form id="kf"><label>Customer email or ID</label><input name="customer" required>
 <label>Secure provider reference (not document number)</label><input name="reference" required>
 <button>Add for Review</button></form></div>`;
}

function kycStatus(kid,status){
 let k=db.kyc.find(x=>x.id===kid);if(k){k.status=status;save();render("kyc")}
}

function support(){
 return `<div class="panel"><h3>Customer Service Tickets</h3>
 ${db.tickets.length?table(["Customer","Message","Status","Reply / Action"],db.tickets.map(t=>[
 esc(t.customer),esc(t.message),esc(t.status),
 `<button onclick="replyTicket('${t.id}')">Reply</button> <button class="gray" onclick="ticketStatus('${t.id}')">Close / Open</button>`
 ])):'<div class="empty">No support tickets.</div>'}</div>
 <div class="panel"><h3>Create Test Support Ticket</h3>
 <form id="tf"><label>Customer email or ID</label><input name="customer" required>
 <label>Message</label><textarea name="message" required></textarea>
 <button>Create Ticket</button></form></div>`;
}

function replyTicket(tid){
 let t=db.tickets.find(x=>x.id===tid);if(!t)return;
 openModal("Reply to Customer",`<p>${esc(t.message)}</p>
 <textarea id="replyText" placeholder="Write reply">${esc(t.reply||"")}</textarea>
 <button onclick="saveReply('${tid}')">Save Reply</button>`);
}

function saveReply(tid){
 let t=db.tickets.find(x=>x.id===tid);t.reply=replyText.value;save();closeModal();render("support");
}

function ticketStatus(tid){
 let t=db.tickets.find(x=>x.id===tid);t.status=t.status==="Closed"?"Open":"Closed";save();render("support");
}

function customers(){
 return `<div class="panel"><h3>Customer Records</h3>
 <form id="cf"><label>Name</label><input name="name" required>
 <label>Email</label><input name="email" type="email" required>
 <button>Add Customer</button></form>
 ${db.customers.length?table(["Name","Email"],db.customers.map(c=>[esc(c.name),esc(c.email)])):'<div class="empty">No customers added.</div>'}</div>`;
}

function settings(){
 return `<div class="panel"><h3>Admin Settings</h3>
 <form id="sf"><label>Admin Email</label><input name="email" type="email" required value="${esc(db.email)}">
 <label>New Password (leave blank to keep current)</label><input name="password" type="password" minlength="8">
 <button>Save Settings</button></form></div>
 <div class="panel"><h3>Backup</h3><button onclick="backup()">Download Data Backup</button></div>
 <div class="notice">This demo stores records in this browser only. It is not a secure production financial or KYC system.</div>`;
}

function table(head,rows){
 return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>
 ${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
 </tbody></table></div>`;
}

document.addEventListener("submit",e=>{
 if(e.target.id==="bf"){
  e.preventDefault();let f=new FormData(e.target);
  db.transactions.push({id:id(),customer:f.get("customer"),amount:+f.get("amount"),type:"Credit",note:f.get("note")});
  save();render("balance");
 }
 if(e.target.id==="wf"){
  e.preventDefault();let f=new FormData(e.target);
  db.withdrawals.push({id:id(),customer:f.get("customer"),amount:+f.get("amount"),details:f.get("details"),status:"Pending"});
  save();render("withdrawals");
 }
 if(e.target.id==="kf"){
  e.preventDefault();let f=new FormData(e.target);
  db.kyc.push({id:id(),customer:f.get("customer"),reference:f.get("reference"),status:"Pending"});
  save();render("kyc");
 }
 if(e.target.id==="tf"){
  e.preventDefault();let f=new FormData(e.target);
  db.tickets.push({id:id(),customer:f.get("customer"),message:f.get("message"),status:"Open",reply:""});
  save();render("support");
 }
 if(e.target.id==="cf"){
  e.preventDefault();let f=new FormData(e.target);
  db.customers.push({name:f.get("name"),email:f.get("email")});
  save();render("customers");
 }
 if(e.target.id==="sf"){
  e.preventDefault();let f=new FormData(e.target);
  db.email=f.get("email").trim();if(f.get("password"))db.password=f.get("password");
  save();alert("Settings saved");render("settings");
 }
});

function backup(){
 let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 let a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download="smart-seller-backup.json";a.click();URL.revokeObjectURL(a.href);
}

if(sessionStorage.getItem(AUTH)==="yes")showApp();
</script>
</body>
</html>
