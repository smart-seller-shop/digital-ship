
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Seller Customer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5fa;color:#202b40;font-family:Arial,sans-serif}
button,input{font:inherit}
button{border:0;border-radius:7px;padding:11px 15px;background:#5267ed;color:#fff;cursor:pointer}
input{width:100%;padding:11px;margin:7px 0 14px;border:1px solid #d8deea;border-radius:7px}
label{font-size:13px;font-weight:bold}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:auto;padding:22px}
.panel,.product{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 9px #00000008}
h1{margin:0;color:#5267ed}
.muted{color:#778398;font-size:13px}
#auth{max-width:400px;margin:55px auto;background:white;padding:25px;border-radius:13px;box-shadow:0 4px 20px #0001}
.tabs{display:flex;gap:8px;margin:18px 0}
.tabs button{flex:1}
.gray{background:#77849a}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
.product img{width:100%;height:155px;object-fit:cover;border-radius:8px;background:#eef1f6}
.product h3{margin:12px 0 6px}
.price{font-size:20px;font-weight:bold;color:#5267ed}
.product input{margin:10px 0}
.product button{width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{text-align:left;padding:11px;border-bottom:1px solid #eee;font-size:13px}
th{background:#f7f8fc}
.tablewrap{overflow-x:auto}
.badge{background:#edf0ff;color:#4357c9;padding:5px 8px;border-radius:15px}
.empty{text-align:center;padding:25px;color:#8791a2}
.notice{background:#fff5d9;color:#76591a;padding:12px;border-radius:7px;font-size:13px}
@media(max-width:600px){
 .wrap{padding:12px}
 .top{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>

<div id="auth">
 <h1>Smart Seller.</h1>
 <h3 id="authTitle">Customer Login</h3>

 <div class="tabs">
  <button type="button" id="loginTab">Login</button>
  <button type="button" class="gray" id="registerTab">Register</button>
 </div>

 <form id="authForm">
  <div id="nameField" class="hidden">
   <label>Your name</label>
   <input id="customerName" autocomplete="name">
  </div>

  <label>Email</label>
  <input id="customerEmail" type="email" required autocomplete="email">

  <label>Password</label>
  <input id="customerPassword" type="password" required minlength="6">

  <button id="authSubmit" style="width:100%">Login</button>
  <p id="authError" style="color:#df4b58"></p>
 </form>

 <p class="muted">Demo account data is stored in this browser only. Do not use a real password.</p>
</div>

<div id="store" class="hidden">
 <div class="wrap">

  <div class="top">
   <div>
    <h1>Smart Seller.</h1>
    <p class="muted" id="welcome"></p>
   </div>
   <button class="gray" id="logout">Logout</button>
  </div>

  <div class="panel notice">
   Products added by the admin will appear below.
   Orders you place will appear in the Admin Panel under Orders.
  </div>

  <div class="panel">
   <h2>Products</h2>
   <div id="productList" class="products"></div>
  </div>

  <div class="panel">
   <h2>My Orders</h2>
   <div id="myOrders"></div>
  </div>

 </div>
</div>

<script>
const DB_KEY="smartSellerFullAdminV3";
const ACCOUNT_KEY="smartSellerCustomerAccountsV1";

let currentCustomer=null;
let registerMode=false;

function readDB(){
 try{
  const saved=JSON.parse(localStorage.getItem(DB_KEY)||"null");
  const data=saved&&typeof saved==="object"?saved:{};

  return {
   ...data,
   products:Array.isArray(data.products)?data.products:[],
   orders:Array.isArray(data.orders)?data.orders:[],
   customers:Array.isArray(data.customers)?data.customers:[],
   transactions:Array.isArray(data.transactions)?data.transactions:[],
   withdrawals:Array.isArray(data.withdrawals)?data.withdrawals:[],
   kyc:Array.isArray(data.kyc)?data.kyc:[],
   tickets:Array.isArray(data.tickets)?data.tickets:[]
  };
 }catch(e){
  return {
   products:[],orders:[],customers:[],
   transactions:[],withdrawals:[],kyc:[],tickets:[]
  };
 }
}

function saveDB(data){
 localStorage.setItem(DB_KEY,JSON.stringify(data));
}

function readAccounts(){
 try{
  const a=JSON.parse(localStorage.getItem(ACCOUNT_KEY)||"[]");
  return Array.isArray(a)?a:[];
 }catch(e){return []}
}

function saveAccounts(a){
 localStorage.setItem(ACCOUNT_KEY,JSON.stringify(a));
}

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function money(n){
 return "$"+Number(n||0).toFixed(2);
}

function makeId(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function setMode(register){
 registerMode=register;

 document.getElementById("authTitle").textContent=
  register?"Create Customer Account":"Customer Login";

 document.getElementById("authSubmit").textContent=
  register?"Create Account":"Login";

 document.getElementById("nameField").classList.toggle("hidden",!register);
 document.getElementById("customerName").required=register;

 document.getElementById("authError").textContent="";
 document.getElementById("loginTab").className=register?"gray":"";
 document.getElementById("registerTab").className=register?"":"gray";
}

document.getElementById("loginTab").onclick=()=>setMode(false);
document.getElementById("registerTab").onclick=()=>setMode(true);

document.getElementById("authForm").onsubmit=e=>{
 e.preventDefault();

 const email=document.getElementById("customerEmail").value.trim().toLowerCase();
 const password=document.getElementById("customerPassword").value;
 const accounts=readAccounts();

 if(registerMode){

  const name=document.getElementById("customerName").value.trim();

  if(!name){
   document.getElementById("authError").textContent="Please enter your name.";
   return;
  }

  if(accounts.some(a=>a.email.toLowerCase()===email)){
   document.getElementById("authError").textContent="This email is already registered.";
   return;
  }

  const account={
   id:makeId(),
   name:name,
   email:email,
   password:password
  };

  accounts.push(account);
  saveAccounts(accounts);

  const db=readDB();

  if(!db.customers.some(c=>(c.email||"").toLowerCase()===email)){
   db.customers.push({name,email});
   saveDB(db);
  }

  currentCustomer=account;
  showStore();

 }else{

  const account=accounts.find(a=>
   a.email.toLowerCase()===email&&a.password===password
  );

  if(!account){
   document.getElementById("authError").textContent="Email or password is incorrect.";
   return;
  }

  currentCustomer=account;
  showStore();
 }
};

function showStore(){
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("store").classList.remove("hidden");

 document.getElementById("welcome").textContent=
  "Welcome, "+currentCustomer.name+" ("+currentCustomer.email+")";

 renderProducts();
 renderOrders();
}

function renderProducts(){

 const db=readDB();
 const list=document.getElementById("productList");

 const available=db.products.filter(p=>Number(p.stock)>0);

 if(!available.length){
  list.innerHTML=
   '<div class="empty">No products are available right now. Please check again later.</div>';
  return;
 }

 list.innerHTML=available.map(p=>`
  <div class="product">

   ${p.image?
    `<img src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.style.display='none'">`:
    '<div style="height:155px;background:#eef1f6;border-radius:8px;display:grid;place-items:center">Product</div>'
   }

   <h3>${esc(p.name)}</h3>

   <div class="price">${money(p.price)}</div>

   <p class="muted">${esc(p.description||"")}</p>

   <p class="muted">Available stock: ${Number(p.stock)||0}</p>

   <label>Quantity</label>
   <input type="number" id="qty-${esc(p.id)}"
    min="1" max="${Number(p.stock)||0}" value="1">

   <button onclick="placeOrder('${esc(p.id)}')">Place Order</button>

  </div>
 `).join("");
}

function placeOrder(productId){

 const db=readDB();

 const product=db.products.find(p=>String(p.id)===String(productId));

 if(!product){
  alert("This product is no longer available.");
  renderProducts();
  return;
 }

 const qtyInput=document.getElementById("qty-"+productId);
 const qty=Number(qtyInput?.value||1);

 if(!Number.isInteger(qty)||qty<1){
  alert("Please enter a valid quantity.");
  return;
 }

 if(qty>Number(product.stock)){
  alert("Not enough stock available.");
  renderProducts();
  return;
 }

 product.stock=Number(product.stock)-qty;

 const order={
  id:makeId(),
  customer:currentCustomer.email,
  product:product.name,
  qty:qty,
  total:Number(product.price)*qty,
  status:"Pending",
  date:new Date().toLocaleString()
 };

 db.orders.push(order);

 saveDB(db);

 alert("Your order has been sent to the admin.");

 renderProducts();
 renderOrders();
}

function renderOrders(){

 const db=readDB();

 const orders=db.orders.filter(o=>
  (o.customer||"").toLowerCase()===currentCustomer.email.toLowerCase()
 ).slice().reverse();

 const target=document.getElementById("myOrders");

 if(!orders.length){
  target.innerHTML='<div class="empty">You have not placed any orders yet.</div>';
  return;
 }

 target.innerHTML=
  '<div class="tablewrap"><table><thead><tr>'+
  '<th>Order ID</th><th>Product</th><th>Quantity</th><th>Total</th><th>Status</th>'+
  '</tr></thead><tbody>'+
  orders.map(o=>`
   <tr>
    <td>${esc(o.id)}</td>
    <td>${esc(o.product)}</td>
    <td>${Number(o.qty)||0}</td>
    <td>${money(o.total)}</td>
    <td><span class="badge">${esc(o.status||"Pending")}</span></td>
   </tr>
  `).join("")+
  '</tbody></table></div>';
}

document.getElementById("logout").onclick=()=>{
 currentCustomer=null;

 document.getElementById("store").classList.add("hidden");
 document.getElementById("auth").classList.remove("hidden");
 document.getElementById("customerPassword").value="";

 setMode(false);
};

/* Refresh products and order status when customer returns to this tab. */
document.addEventListener("visibilitychange",()=>{
 if(!document.hidden&&currentCustomer){
  renderProducts();
  renderOrders();
 }
});

setMode(false);
</script>
</body>
</html>
